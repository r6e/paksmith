name: Fuzz

# Scheduled-only — actual fuzz runs do not gate PRs. The harness lives
# in fuzz/fuzz_targets/ and depends on paksmith-core via path-dep;
# changes that break the harness build are caught by the `fuzz_build`
# job in ci.yml (PR-time, build-only). Running the actual fuzzer on
# every PR would burn ~10 min per push for no additional signal.
#
# Nightly cron is offset from the CI baseline so runs don't pile up on
# the same runner-pool window: CI runs are user-triggered (random),
# audit runs at 7am UTC, CodeQL Monday 8am UTC, the nightly build at
# 9:17am UTC. Fuzz runs at 4am UTC.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Per-target fuzz budget in seconds (default 600 = 10 min)."
        required: false
        default: "600"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a running fuzz job

permissions:
  contents: read

jobs:
  fuzz:
    # The housekeeping job finds this run's targets by this name.
    name: cargo-fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    # 10 min budget per target + ~5 min for toolchain + build + corpus
    # prep + artifact upload, + up to ~3 min for the corpus fallback on
    # a cache miss. 25 min ceiling absorbs slow runners.
    timeout-minutes: 25
    # Crashes are findings, not workflow failures. `continue-on-error`
    # so a discovered crash uploads its artifact and the workflow
    # surfaces yellow (not red) — until baseline is established, red
    # would be noise.
    continue-on-error: true
    # This job builds and runs the repository's code, so its token can
    # only read. The steps that need to write are in the `housekeeping`
    # job.
    permissions:
      contents: read
      actions: read # download an earlier run's corpus artifact
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_pak_open
          - fuzz_usmap_parse
          - fuzz_asset_parse
          - fuzz_bulk_decompress
          - fuzz_lz4_decompress
          - fuzz_zstd_decompress
          - fuzz_gzip_decompress
          - fuzz_texture_decode
          - fuzz_audio_decode
          - fuzz_export_pipeline
          - fuzz_locres_parse
        include:
          # Seed glob per target — `.pak` fixtures for the container
          # reader, `.usmap` for the mappings parser, `.uasset` for
          # the asset parser. The seed-corpus step uses `${SEED_GLOB}`.
          - target: fuzz_pak_open
            seed_glob: '*.pak'
          - target: fuzz_usmap_parse
            seed_glob: '*.usmap'
          - target: fuzz_asset_parse
            seed_glob: '*.uasset'
          # The Phase 3 export pipeline parses raw `.uasset` bytes, same
          # as the asset parser, so it shares the `.uasset` seed corpus.
          - target: fuzz_export_pipeline
            seed_glob: '*.uasset'
          # A target's `dict` becomes the fuzz step's `-dict`; the file says why.
          - target: fuzz_gzip_decompress
            dict: fuzz/dicts/gzip.dict
          # fuzz_bulk_decompress / fuzz_lz4_decompress / fuzz_zstd_decompress /
          # fuzz_gzip_decompress / fuzz_texture_decode / fuzz_audio_decode /
          # fuzz_locres_parse have no top-level
          # `tests/fixtures` seed (the sole `.locres` fixture lives at
          # `tests/fixtures/data/`, below the `-maxdepth 1` seed glob;
          # the flat header-first parser reaches its magic/version/
          # count/string paths on random input by construction): their input is a
          # synthetic `[header byte(s)][payload]` layout (a size/format/codec
          # selector prefix), not a committed fixture file, so a file seed
          # wouldn't be well-formed for the harness. They fuzz from scratch — the decode
          # paths are reached on random input by construction (texture
          # self-sizes the encoded buffer to the exact length its decoder
          # validates; the bulk/audio targets exercise the reject + cap paths
          # that are the DoS-relevant surface), except zstd's and gzip's:
          # random input stops at zstd's v1-frame gate, and the cap and decode
          # behind it run once the fuzzer builds a block of whole v1 or
          # skippable frames; gzip's `dict` carries it past flate2's header
          # check. The empty `${SEED_GLOB}` makes the seed step a clean
          # zero-match.
    env:
      # libfuzzer instrumentation needs nightly; clear RUSTFLAGS so
      # workspace-wide `-D warnings` doesn't escalate nightly's
      # routine new lints into build failures.
      RUSTFLAGS: ""
      # Single source of truth for the cache key schema — referenced
      # by both Restore and Save steps. Rolling per-run-id; the
      # prefix variant is what `restore-keys` matches against.
      CORPUS_CACHE_KEY: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      CORPUS_CACHE_PREFIX: fuzz-corpus-${{ matrix.target }}-
      # cmin-skip threshold: a fuzz run that produced fewer than this
      # many new corpus inputs is treated as "fuzz died early" and
      # skips the cmin step (issue #205). Single source of truth so
      # the comparison + the skip message + the docs stay in sync.
      CMIN_GROWTH_THRESHOLD: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The fuzz targets must not find the token in .git/config.
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          # The cache key holds the nightly's version, so each day saves
          # a new set that cache-prune.yml cannot group with the last.
          cache: "false"
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-fuzz
      # Rolling per-run-id key (Actions caches are immutable per
      # key); `restore-keys` prefix grabs the newest prior entry. A
      # miss falls back to the artifact step below. Split from save so
      # save can run under `if: always()` and survive cargo-fuzz exit-
      # non-zero on crash discovery — the monolithic `actions/cache`
      # post-hook would skip it.
      - name: Restore evolved corpus
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: ${{ env.CORPUS_CACHE_KEY }}
          restore-keys: |
            ${{ env.CORPUS_CACHE_PREFIX }}
      # GitHub evicts the corpus cache when the repository's caches pass
      # its size limit. On a miss, this takes the corpus from the
      # artifact that the newest earlier scheduled run uploaded for this
      # target. Only a scheduled run counts: it always runs `main`'s
      # copy of this file, while a dispatched or pull-request run can
      # use an edited copy and upload an artifact under any name. A
      # failure here leaves the seed corpus.
      #
      # Only the regular files of the target's corpus directory are
      # copied. The crash inputs an artifact can also hold stay out of
      # `fuzz/artifacts/`, where they would be reported as this run's.
      - name: Restore evolved corpus from an earlier run's artifact
        id: fallback
        if: steps.restore.outputs.cache-matched-key == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
          # One scheduled run a day; an artifact lasts 30 days.
          MAX_RUNS: 30
        run: |
          set -euo pipefail
          # A cache restore that failed partway can leave files here, and
          # they are not a corpus. A link at `fuzz/corpus` would send the
          # `rm`, and every later step, somewhere else.
          dest="fuzz/corpus/${TARGET}"
          if [[ -L fuzz/corpus ]]; then
            echo "::warning::${TARGET}: fuzz/corpus was a symbolic link; removed"
            rm -f fuzz/corpus
          fi
          rm -rf "${dest}"
          scratch="${RUNNER_TEMP}/corpus-fallback"
          dir="${scratch}/artifact"
          stage="${scratch}/stage"
          trap 'rm -rf "${scratch}" || true' EXIT
          # `-k` is for a `gh` that ignores the first signal.
          runs="$(timeout -k 10 30 gh api -X GET "repos/${GH_REPO}/actions/workflows/fuzz.yml/runs" \
            -f event=schedule -f status=completed -F per_page="${MAX_RUNS}" \
            --jq '[.workflow_runs[] | select(.event == "schedule" and .head_repository.full_name == env.GH_REPO) | .id] | sort | reverse | .[]')"
          for run in ${runs}; do
            [[ "${run}" =~ ^[0-9]+$ && "${run}" != "${GITHUB_RUN_ID}" ]] || continue
            # The job has 25 minutes and the fuzzing needs most of them.
            # An artifact is a few megabytes at most, so a download that
            # takes 30 seconds has stalled and is cut off, and no new
            # one starts once this step has run for two minutes.
            if ((SECONDS >= 120)); then
              echo "::warning::${TARGET}: no corpus cache, and out of time looking for a usable artifact; fuzzing from the seed corpus"
              exit 0
            fi
            # Emptied for every run, so that what a rejected download
            # left behind cannot fill the disk for the next one. `gh`
            # keeps the zip in `TMPDIR`, and leaves it there when it is
            # cut off, so that goes here too.
            rm -rf "${scratch}"
            mkdir "${scratch}"
            TMPDIR="${scratch}" timeout -k 10 30 gh run download "${run}" --name "fuzz-${TARGET}-${run}" --dir "${dir}" || continue
            [[ -d "${dir}/corpus/${TARGET}" ]] || continue
            # Copied to a staging directory and moved into place whole,
            # so that a copy that fails partway restores nothing: the
            # run would save a partial corpus as the next one's base.
            # `+` makes `find` report a failed `cp`, where `\;` hides it.
            mkdir "${stage}"
            if ! find "${dir}/corpus/${TARGET}" -maxdepth 1 -type f -exec cp -t "${stage}" {} +; then
              echo "::warning::${TARGET}: could not copy run ${run}'s corpus; trying the run before it"
              continue
            fi
            count="$(find "${stage}" -maxdepth 1 -type f | wc -l | tr -d ' ')"
            ((count > 0)) || continue
            mkdir -p fuzz/corpus
            mv -T "${stage}" "${dest}"
            echo "run=${run}" >> "${GITHUB_OUTPUT}"
            echo "Restored ${count} corpus files from run ${run}'s artifact."
            exit 0
          done
          echo "::warning::${TARGET}: no corpus cache and no usable artifact in the last ${MAX_RUNS} scheduled runs; fuzzing from the seed corpus"
      # Seed corpus: starting from valid fixtures means the fuzzer
      # explores adversarial mutations of real structures immediately,
      # instead of spending the first ~5 min rediscovering "files
      # start with magic bytes." `cp -n` is no-clobber so a re-run
      # keeps any newly-discovered corpus entries from a prior
      # invocation. Glob comes from matrix `include:` above.
      - name: Seed corpus from fixtures
        env:
          TARGET: ${{ matrix.target }}
          SEED_GLOB: ${{ matrix.seed_glob }}
        # `find -exec` instead of `cp tests/fixtures/*.<ext> …` so a
        # zero-match (future fixture relocation, generator failure)
        # exits 0 cleanly rather than passing a literal glob to `cp`
        # and failing the step. `-maxdepth 1` keeps us pinned to the
        # fixture directory.
        run: |
          mkdir -p "fuzz/corpus/${TARGET}"
          find tests/fixtures -maxdepth 1 -name "${SEED_GLOB}" -type f \
            -exec cp -n {} "fuzz/corpus/${TARGET}/" \;
      # Baseline corpus count, paired with `Measure corpus growth`
      # below for cmin gating (issue #205).
      - name: Snapshot corpus baseline
        id: baseline
        env:
          TARGET: ${{ matrix.target }}
        run: |
          count=$(find "fuzz/corpus/${TARGET}" -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "Baseline corpus: ${count} entries"
      - name: Run cargo-fuzz
        # Step-level continue-on-error so a crash exit (non-zero from
        # cargo-fuzz) does NOT skip subsequent steps. The job-level
        # `continue-on-error` only controls how `needs.<job>.result`
        # propagates — it does not affect the in-job step cascade.
        # Without this, the `Minimize corpus` and `Save evolved
        # corpus` post-fuzz steps would be skipped on the most
        # valuable runs (those that found a crash).
        continue-on-error: true
        env:
          TARGET: ${{ matrix.target }}
          # workflow_dispatch input ("max_total_time") wins; cron uses
          # the literal 600. Defensive default in env keeps `${BUDGET}`
          # bound even if the action's input parsing is broken.
          BUDGET: ${{ inputs.max_total_time || '600' }}
          DICT: ${{ matrix.dict }}
        # Explicit limits matter:
        #   -max_total_time=$BUDGET    : overall fuzzing wall clock
        #   -timeout=60                : per-input timeout (kills hangs)
        #   -rss_limit_mb=2048         : libfuzzer kills the process at
        #                                this. Without it, an alloc-of-
        #                                doom would OOM-kill the
        #                                runner before libfuzzer
        #                                records it as a crash. The
        #                                pak code's MAX_UNCOMPRESSED_
        #                                ENTRY_BYTES (8 GiB) is way
        #                                above this; clamp here.
        #   -max_len=1048576           : 1 MiB ceiling on a single
        #                                input. Real pak files in the
        #                                fixture set are <= 30 KiB.
        #   -dict=$DICT                : only when the target has a
        #                                matrix `dict`, which must
        #                                exist.
        # `--target x86_64-unknown-linux-gnu` overrides cargo-fuzz's
        # Linux default (`-linux-musl`). musl is statically-linked
        # libc and incompatible with the ASan instrumentation
        # cargo-fuzz injects; gnu is dynamically-linked. Same
        # override applied in the ci.yml `fuzz_build` job.
        run: |
          if [[ -n "${DICT}" && ! -f "${DICT}" ]]; then
            echo "::error::${TARGET}: dictionary ${DICT} not found"
            exit 1
          fi
          cargo fuzz run "${TARGET}" \
            --target x86_64-unknown-linux-gnu \
            -- \
            -max_total_time="${BUDGET}" \
            -timeout=60 \
            -rss_limit_mb=2048 \
            -max_len=1048576 \
            ${DICT:+"-dict=${DICT}"}
      # Issue #205: cmin gating — measure the corpus delta produced
      # by the fuzz step. If fuzz crashed early (harness died, OOM
      # in first seconds) the delta is tiny and cmin would waste
      # runner time minimizing a near-seed-only corpus. Threshold
      # comes from `CMIN_GROWTH_THRESHOLD` at the job env level
      # (single source of truth).
      #
      # `BASELINE` defaulted to 0 defensively — if the baseline step
      # crashed and its output is empty, `$((after - ))` is a bash
      # syntax error that would abort this step; the default keeps
      # `growth.outputs.should_cmin` settable so the downstream cmin
      # gate degrades to "skip" cleanly.
      - name: Measure corpus growth
        id: growth
        if: always()
        env:
          TARGET: ${{ matrix.target }}
          BASELINE: ${{ steps.baseline.outputs.count }}
          THRESHOLD: ${{ env.CMIN_GROWTH_THRESHOLD }}
        run: |
          : "${BASELINE:=0}"
          after=$(find "fuzz/corpus/${TARGET}" -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')
          delta=$((after - BASELINE))
          echo "after=${after}" >> "$GITHUB_OUTPUT"
          echo "delta=${delta}" >> "$GITHUB_OUTPUT"
          if [ "${delta}" -gt "${THRESHOLD}" ]; then
            echo "should_cmin=true" >> "$GITHUB_OUTPUT"
            echo "Corpus delta: ${delta} (baseline=${BASELINE}, after=${after}) — running cmin"
          else
            echo "should_cmin=false" >> "$GITHUB_OUTPUT"
            echo "Corpus delta: ${delta} (baseline=${BASELINE}, after=${after}) — skipping cmin (threshold=${THRESHOLD})"
          fi
      # Prune redundant inputs before caching — libfuzzer never
      # prunes on save. `-max_len` matches the run step so cmin
      # measures coverage at the same input-size envelope (otherwise
      # cmin's libfuzzer default of 4096 bytes silently over-prunes
      # large inputs). Exit code is captured so a silent cmin
      # regression (toolchain incompat, etc.) surfaces in the
      # workflow summary instead of going unnoticed.
      #
      # Gated on `growth.outputs.should_cmin` (issue #205) so an
      # early-crash fuzz run doesn't burn ~1-2 min on a near-empty
      # corpus.
      - name: Minimize corpus
        id: cmin
        if: always() && steps.growth.outputs.should_cmin == 'true'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          exit_code=0
          cargo fuzz cmin "${TARGET}" \
            --target x86_64-unknown-linux-gnu \
            -- \
            -max_len=1048576 \
            || exit_code=$?
          echo "exit=${exit_code}" >> "$GITHUB_OUTPUT"
          [ "${exit_code}" -eq 0 ] || echo "${exit_code}" > "${RUNNER_TEMP}/cmin-exit"
      - name: Summarize results
        if: always()
        env:
          TARGET: ${{ matrix.target }}
          # Just "skipped" (not "skipped (no growth)") because cmin
          # can be skipped for reasons beyond no-growth — e.g. if the
          # growth step itself failed or didn't run, `should_cmin` is
          # unset and cmin skips too. The corpus-growth line below
          # disambiguates by showing the actual delta.
          CMIN_EXIT: ${{ steps.cmin.outputs.exit || 'skipped' }}
          CORPUS_DELTA: ${{ steps.growth.outputs.delta || 'unknown' }}
          # `cache-matched-key` is non-empty on any restore (exact
          # key OR `restore-keys` prefix match), empty on true miss.
          # No decay over time as the corpus matures, unlike a
          # corpus-vs-fixture-count heuristic.
          CACHE_MATCH: ${{ steps.restore.outputs.cache-matched-key || '' }}
          FALLBACK_RUN: ${{ steps.fallback.outputs.run || '' }}
          FALLBACK_OUTCOME: ${{ steps.fallback.outcome }}
        shell: bash
        run: |
          artifacts=$(find "fuzz/artifacts/${TARGET}" -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')
          corpus=$(find "fuzz/corpus/${TARGET}" -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ -n "${CACHE_MATCH}" ]; then
            restored="from the cache (${CACHE_MATCH})"
          elif [ -n "${FALLBACK_RUN}" ]; then
            restored="from run ${FALLBACK_RUN}'s artifact (cache miss)"
          elif [ "${FALLBACK_OUTCOME}" = failure ]; then
            restored="no (cache miss, and the artifact lookup failed)"
          else
            restored="no (cache miss, no artifact restored)"
          fi
          {
            echo "### Fuzz target: ${TARGET}"
            echo "- Crashes/timeouts: ${artifacts}"
            echo "- Corpus size (post-cmin): ${corpus}"
            echo "- Corpus growth this run: ${CORPUS_DELTA} new inputs"
            echo "- Corpus restored: ${restored}"
            echo "- cmin exit code: ${CMIN_EXIT}"
          } >> "$GITHUB_STEP_SUMMARY"
      # The housekeeping job looks for this artifact's name, and never
      # reads its contents, to learn that cmin failed for this target.
      # The name carries the attempt so that a re-run can upload again.
      # The housekeeping job also matches this step's name, to alert
      # when the upload failed: rename the step there too.
      - name: Flag a cmin failure
        # The empty-string guard matters: a skipped cmin step leaves
        # `outputs.exit` unset, and `!= '0'` alone would flag it.
        if: always() && steps.cmin.outputs.exit != '0' && steps.cmin.outputs.exit != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-cmin-failed-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cmin-exit
          if-no-files-found: error
          retention-days: 1
      # Paired with the restore step above; `if: always()` is what
      # preserves the corpus on cargo-fuzz crash exit.
      #
      # To nuke a poisoned corpus, both stores must go while no fuzz run
      # is unfinished, or the next run restores it from the one that is
      # left: every cache of the target, and every scheduled run updated
      # since it was poisoned, whose artifacts go with it. The commands
      # are in the alert issue's text, in the housekeeping job below.
      - name: Save evolved corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: ${{ env.CORPUS_CACHE_KEY }}
      # Artifact upload is complementary to the cache, not redundant:
      # `fuzz/artifacts/` (crash inputs) is the irreplaceable part —
      # the cache only persists the corpus, not findings. The corpus
      # copy here gives a 30-day offline snapshot for replaying a
      # specific run (vs the cache's rolling-newest semantics).
      # The fallback restore step reads this artifact by its name and
      # its `corpus/<target>/` layout: change them together.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fuzz-${{ matrix.target }}-${{ github.run_id }}
          path: |
            fuzz/artifacts/
            fuzz/corpus/
          retention-days: 30

  # Holds the write permissions, so it runs nothing from the repository
  # and nothing the fuzz jobs produced: no checkout, no cache, no
  # artifact download. It acts only on what GitHub reports about this
  # run. The fuzz jobs can still choose cache keys and artifact names,
  # so a name counts only if it is exactly the one expected for a
  # target of this run.
  housekeeping:
    name: housekeeping
    needs: fuzz
    # Runs whatever the fuzz jobs' results, unless the run is cancelled.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # This is the only job that can enable or dispatch a workflow, so
    # it must run no repository code. SECURITY.md's suspected-leak
    # steps say what an older copy of this workflow, without this job,
    # allows.
    permissions:
      actions: write # delete cache entries (#206)
      issues: write # open or comment on the cmin alert (#204)
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The targets come from the workflow file's matrix by way of the
      # job names, which code running in a fuzz job cannot change.
      - name: List this run's fuzz targets
        id: targets
        run: |
          set -euo pipefail
          jobs="$(gh api --paginate \
            "repos/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            --jq '.jobs[].name')"
          targets=()
          while read -r job; do
            [[ "${job}" =~ ^cargo-fuzz\ \((fuzz_[a-z0-9_]+)\)$ ]] || continue
            targets+=("${BASH_REMATCH[1]}")
          done <<< "${jobs}"
          ((${#targets[@]} > 0)) || {
            echo "::error::no job of this run is named 'cargo-fuzz (<target>)'"
            exit 1
          }
          echo "list=${targets[*]}" >> "${GITHUB_OUTPUT}"
      # Raises the cmin alert, which would otherwise show only in the
      # run's summary. The title is fixed per target, so later failures
      # comment on the open issue. A failure here fails the job: this
      # is the only notice of a cmin regression. A marker from any
      # attempt of the run counts, so a re-run after a failed alert
      # raises it again. The cost is a repeated comment when the earlier
      # attempt's alert did go out, even if cmin passed in the re-run.
      # A target whose marker step failed in this attempt is alerted
      # too: that step runs only when cmin failed.
      - name: Alert on cmin failure
        env:
          TARGETS: ${{ steps.targets.outputs.list }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          artifacts="$(gh api --paginate \
            "repos/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[].name')"
          marker_step_failed="$(gh api --paginate \
            "repos/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            --jq '.jobs[] | select(any(.steps[]?; .name == "Flag a cmin failure" and .conclusion == "failure")) | .name')"
          failed=0
          for target in ${TARGETS}; do
            grep -q -x -E "fuzz-cmin-failed-${target}-[0-9]+" <<< "${artifacts}" ||
              grep -q -x -F "cargo-fuzz (${target})" <<< "${marker_step_failed}" || continue
            title="[fuzz] cmin regression detected (target: ${target})"
            body="$(printf '%s\n' \
              "The nightly fuzz workflow's \`cargo fuzz cmin\` step exited non-zero for target \`${target}\`." \
              "" \
              "Run: ${RUN_URL} (its summary gives the exit code)" \
              "" \
              "A non-zero cmin typically indicates a toolchain incompat (nightly drift), harness ABI mismatch, or corpus poisoning." \
              "" \
              "If the corpus is suspected poisoned, delete every cache of the target and every scheduled fuzz run updated since it was poisoned, with the workflow disabled and no fuzz run unfinished meanwhile. The next run restores the corpus from whichever is left: the newest cache, or else the newest scheduled run's artifact. Deleting a run removes its artifacts, so download any crash artifact you need first." \
              "" \
              "Run these in order. The first line keeps every command on this repository, whatever directory the shell is in." \
              "- A run already queued may still start after the disable (untested), and a run saves the corpus as it ends, even when cancelled. Cancel each run the first listing prints, and repeat the listing until it prints nothing." \
              "- Delete each cache the second listing prints; without \`--limit\` it shows only 30." \
              "- Delete each run of the third listing whose \`updatedAt\` is at or after the poisoning, including any you just cancelled. That takes in a run created before it that was still running, or was re-run, after it." \
              '```' \
              "export GH_REPO=${GH_REPO}" \
              "gh workflow disable fuzz.yml" \
              "for s in requested queued pending waiting in_progress; do gh run list --workflow fuzz.yml --all --status \"\$s\" --limit 1000 --json databaseId --jq '.[].databaseId'; done" \
              "gh run cancel <run-id>" \
              "gh cache list --key fuzz-corpus-${target}- --limit 1000 --json id --jq '.[].id'" \
              "gh cache delete <cache-id>" \
              "gh run list --workflow fuzz.yml --all --event schedule --limit 100 --json databaseId,updatedAt,conclusion" \
              "gh run delete <run-id>" \
              "gh workflow enable fuzz.yml" \
              "unset GH_REPO" \
              '```')"
            # `--search` matches substrings, so jq keeps the exact title.
            # Only an issue this workflow opened counts as the existing one.
            if ! existing="$(gh issue list --state open --author app/github-actions \
              --search "in:title \"${title}\"" --json number,title \
              --jq "[.[] | select(.title == \"${title}\") | .number][0] // empty")"; then
              echo "::warning::${target}: could not search for an open alert"
              failed=1
              continue
            fi
            if [[ -n "${existing}" ]]; then
              echo "Commenting on existing issue #${existing}"
              gh issue comment "${existing}" --body "${body}" || failed=1
            else
              echo "Creating new alert issue"
              gh issue create --title "${title}" --body "${body}" --label ci || failed=1
            fi
          done
          ((failed == 0)) || {
            echo "::error::at least one cmin alert could not be raised"
            exit 1
          }
      # Keeps the newest `KEEP` corpus caches of each target on this
      # run's ref: the one just saved and one earlier generation for
      # the restore to fall back on. A target whose cache this run did
      # not save is left alone, so a failed save cannot evict an older
      # corpus. The 7-day eviction is the backstop if this step fails.
      # It runs after the alert, and whether or not the alert failed, so
      # a slow prune cannot use up the time the alert needs.
      #
      # `key` is a prefix filter, so jq keeps only keys of the exact
      # form. jq runs once per page under `--paginate` (cli/cli#10459),
      # so it emits every entry and `tail` skips the newest `KEEP`
      # across the whole, newest-first, list.
      - name: Prune older fuzz-corpus cache entries
        if: ${{ !cancelled() && steps.targets.outcome == 'success' }}
        continue-on-error: true
        env:
          TARGETS: ${{ steps.targets.outputs.list }}
          KEEP: 2
        run: |
          set -euo pipefail
          for target in ${TARGETS}; do
            prefix="fuzz-corpus-${target}-"
            if ! entries="$(gh api --paginate -X GET "repos/${GH_REPO}/actions/caches" \
              -f key="${prefix}" -f ref="${GITHUB_REF}" \
              -f sort=created_at -f direction=desc -F per_page=100 \
              --jq '.actions_caches[] | select(.key | test("\\A'"${prefix}"'[0-9]+\\z")) | "\(.id) \(.key)"')"; then
              echo "::warning::${target}: could not list the corpus caches"
              continue
            fi
            if ! awk -v saved="${prefix}${GITHUB_RUN_ID}" '$2 == saved { found = 1 } END { exit !found }' <<< "${entries}"; then
              echo "${target}: this run saved no corpus, so nothing is pruned"
              continue
            fi
            while read -r id key; do
              [[ "${id}" =~ ^[0-9]+$ ]] || continue
              echo "${target}: deleting ${key} (cache ${id})"
              gh api -X DELETE "repos/${GH_REPO}/actions/caches/${id}" ||
                echo "::warning::could not delete cache ${id}"
            done < <(tail -n +"$((KEEP + 1))" <<< "${entries}")
          done
