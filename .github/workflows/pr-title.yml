name: PR Title

on:
  # pull_request_target runs in the context of the base branch, not the
  # PR head — safe because this check only reads PR metadata (title)
  # and runs no PR-supplied code.
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

# Keyed on the head SHA as well as the PR: events can arrive out of
# order, and a run for a superseded head must never cancel the run for
# the head that will merge, or this required check is left with no
# conclusion and the PR sits BLOCKED while green.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate title (conventional commits)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Enforces conventional-commit format on PR titles. PRs are
      # squash-merged into main, so the PR title becomes the commit
      # title — this gate is what keeps `git log` parseable for
      # release tooling (changelogs, semver bumps) downstream.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            perf
            build
            style
            revert
          # Scope is optional — many PRs are workspace-wide and don't
          # have a sensible scope. Don't force one.
          requireScope: false
          # Subject line: lowercase first letter, no trailing period —
          # matches the repo's existing commit history.
          subjectPattern: ^(?![A-Z])(?!.*\.$).+$
          subjectPatternError: |
            The PR title subject must start with a lowercase letter and
            must not end with a period.
          # Exempt Dependabot PRs: its title template hardcodes
          # "Bump X from Y to Z" with a capital B, and Dependabot offers
          # no configuration to lowercase it. Every Dependabot PR already
          # carries the `dependencies` label (set in dependabot.yml), so
          # the validator skips cleanly without affecting human-authored
          # PRs.
          ignoreLabels: |
            dependencies
