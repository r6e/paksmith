name: Package
description: |
  Build the release binaries for the runner's native target and upload
  them as the workflow artifact `paksmith-<label>-<target>`, holding
  `paksmith-<label>-<target>.<ext>` and `SHA256SUMS-<target>.txt`.

  Expects a checkout with `persist-credentials: false`.

inputs:
  label:
    description: Version part of the archive name, such as a release tag.
    required: true
  target:
    description: Target triple the runner builds natively; names the archive and checksum file.
    required: true
  retention-days:
    description: Days the artifact is kept.
    required: true

runs:
  using: composite
  steps:
    # No restored cache: the binaries are handed to users, and the cache
    # scope is shared with every other job on main.
    - uses: ./.github/actions/setup-rust
      with:
        cache: "false"
    # The build is for the runner's host, so a `target` naming anything
    # else would label the archive with a triple it was not built for.
    - name: Check the target
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        host="$(rustc -vV | sed -n 's/^host: //p')"
        [[ "${host}" == "${TARGET}" ]] || {
          echo "::error::this runner builds ${host}, not ${TARGET}"
          exit 1
        }
    - name: Name the files
      id: names
      shell: bash
      env:
        LABEL: ${{ inputs.label }}
        TARGET: ${{ inputs.target }}
        EXT: ${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}
      run: |
        staging="paksmith-${LABEL}-${TARGET}"
        {
          echo "staging=${staging}"
          echo "archive=${staging}.${EXT}"
          echo "checksums=SHA256SUMS-${TARGET}.txt"
        } >> "${GITHUB_OUTPUT}"
    # Before changing the `-p` set, read the `__test_utils` caveat in
    # crates/paksmith-core/Cargo.toml.
    - name: Build release binaries
      shell: bash
      run: cargo build --release --locked -p paksmith-cli -p paksmith-gui
    # Ad-hoc codesigning of macOS binaries. paksmith does not pay for
    # Apple Developer Program membership, so Developer ID notarization
    # is not on the roadmap (#168 closed won't-fix) — this is the
    # permanent macOS signing strategy.
    #
    # aarch64 Mach-O binaries on Apple Silicon already carry a
    # linker-applied ad-hoc signature (CS_LINKER_SIGNED flag set) —
    # this step replaces it with an explicit ad-hoc signature (same
    # `-` identity, CS_LINKER_SIGNED cleared). The delta is narrow but
    # real: a subclass of sandbox APIs (NSTask spawn checks, certain
    # entitlement gates) accepts explicit ad-hoc but rejects
    # linker-signed. Gatekeeper still blocks first-run permanently;
    # users follow the workaround documented in the README (#165).
    - name: Ad-hoc codesign binaries (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        for bin in paksmith paksmith-gui; do
          codesign --force --sign - "target/release/${bin}"
          codesign --verify --strict "target/release/${bin}"
        done
    - name: Stage archive contents (Unix)
      if: runner.os != 'Windows'
      shell: bash
      env:
        STAGING: ${{ steps.names.outputs.staging }}
        ARCHIVE: ${{ steps.names.outputs.archive }}
        CHECKSUMS: ${{ steps.names.outputs.checksums }}
      run: |
        mkdir -p "${STAGING}"
        cp target/release/paksmith "${STAGING}/"
        cp target/release/paksmith-gui "${STAGING}/"
        cp LICENSE README.md "${STAGING}/"
        tar czf "${ARCHIVE}" "${STAGING}"
        shasum -a 256 "${ARCHIVE}" > "${CHECKSUMS}"
    - name: Stage archive contents (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        STAGING: ${{ steps.names.outputs.staging }}
        ARCHIVE: ${{ steps.names.outputs.archive }}
        CHECKSUMS: ${{ steps.names.outputs.checksums }}
      run: |
        New-Item -ItemType Directory -Force -Path $env:STAGING | Out-Null
        Copy-Item target/release/paksmith.exe -Destination $env:STAGING
        Copy-Item target/release/paksmith-gui.exe -Destination $env:STAGING
        Copy-Item LICENSE, README.md -Destination $env:STAGING
        Compress-Archive -Path $env:STAGING -DestinationPath $env:ARCHIVE
        $hash = (Get-FileHash -Algorithm SHA256 $env:ARCHIVE).Hash.ToLower()
        # Issue #167: LF (not CRLF) for `sha256sum -c --strict` on Linux.
        [System.IO.File]::WriteAllText("$pwd/${env:CHECKSUMS}", "${hash}  ${env:ARCHIVE}`n")
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.names.outputs.staging }}
        path: |
          ${{ steps.names.outputs.archive }}
          ${{ steps.names.outputs.checksums }}
        if-no-files-found: error
        overwrite: true # a re-run replaces the earlier attempt's upload
        retention-days: ${{ inputs.retention-days }}
