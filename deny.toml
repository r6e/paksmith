[advisories]
# `unmaintained = "workspace"` scopes the unmaintained advisory check to direct
# workspace dependencies only (not transitive deps).  This consciously accepts
# the unmaintained gtk3-rs transitive tree that muda 0.21.x's default `gtk3`
# backend pulls in on Linux (atk / gdk / gtk / glib / pango / cairo crates, all
# unmaintained in favour of gtk4-rs).  The gtk3 path is dormant: those crates
# are Linux-only, and there muda's backend attaches only to a GTK window, which
# an iced/winit window is not, so paksmith never attaches the menu.  The gtk3-rs
# part of this acceptance goes away when paksmith-gui switches muda to its
# opt-in `gtk4` backend.
#
# NOTE: cargo-audit (the .github/workflows/audit.yml job) has no equivalent
# workspace-scoping option, so it mirrors this acceptance as an explicit per-ID
# `ignore:` list. Keep the two in sync: a newly accepted transitive advisory
# added here must also be added to that workflow's ignore list (and vice versa).
unmaintained = "workspace"
unsound = "all"
yanked = "warn"
ignore = [
    # RUSTSEC-2024-0429: unsoundness in glib::VariantStrIter.
    # Advisory is Linux-only (GTK dep; glib 0.18.x via muda → gtk).
    # Provable facts: (1) paksmith never calls glib::VariantStrIter anywhere in
    # its codebase; (2) on Linux, muda attaches only to a GTK window and an
    # iced/winit window is not one, so muda's gtk menu attachment code is never
    # executed — the gtk code path is dormant;
    # (3) the advisory is rated INFO/unsound and affects only VariantStrIter
    # iteration over attacker-controlled GLib Variant data, which paksmith does
    # not process (the menu strings are all compile-time constants).
    # Fixed in glib 0.20+; muda 0.21.x's default `gtk3` backend still pins
    # gtk/glib 0.18.x.  Remove this ignore when paksmith-gui switches muda to its
    # `gtk4` backend (glib 0.22), or muda's gtk3 backend moves past glib 0.18.
    { id = "RUSTSEC-2024-0429", reason = "paksmith never calls glib::VariantStrIter; Linux gtk path is dormant (the menu is never attached to a GTK window); menu strings are compile-time constants with no attacker input; fixed in glib 0.20+, which muda's default gtk3 backend does not reach" },
    # RUSTSEC-2026-0194 / RUSTSEC-2026-0195: DoS advisories in quick-xml < 0.41
    # (quadratic runtime on duplicate start-tag attribute names; unbounded
    # namespace-declaration allocation in `NsReader`). Both require
    # attacker-controlled XML input to trigger.
    # Provable non-applicability: (1) quick-xml is pulled by exactly ONE crate in
    # the tree — wayland-scanner (sole dependent in Cargo.lock) — a Linux-only
    # BUILD dependency that generates code at compile time and is not present in
    # the shipped runtime binary. (2) wayland-scanner parses only the wayland
    # protocol XML bundled with the wayland stack (developer-controlled, trusted
    # input); no attacker-controlled XML ever reaches quick-xml. (3) macOS and
    # Windows builds don't pull the wayland tree at all.
    # Fully upstream-BLOCKED: the fix landed in quick-xml 0.41, but NO
    # wayland-scanner release uses it — the latest (0.31.10) still pins
    # quick-xml ^0.39 — and rfd 0.17.2 (latest) pins wayland-client ^0.31, so no
    # dependency-resolution path reaches the patched quick-xml. Remove both
    # ignores once wayland-scanner ships a release on quick-xml 0.41+.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml is a Linux-only build-time dep (only wayland-scanner uses it) parsing bundled trusted wayland protocol XML; no attacker input reaches it and it is not in the runtime binary; fix (0.41+) blocked — no wayland-scanner release uses quick-xml 0.41 and rfd 0.17.2 pins the ^0.31 wayland stack" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml is a Linux-only build-time dep (only wayland-scanner uses it) parsing bundled trusted wayland protocol XML; no attacker input reaches it and it is not in the runtime binary; fix (0.41+) blocked — no wayland-scanner release uses quick-xml 0.41 and rfd 0.17.2 pins the ^0.31 wayland stack" },
    # RUSTSEC-2026-0253: unsoundness in `lru` < 0.18.2 — `LruCache::pop()` skips
    # `detach()` when a stored KEY's `Drop` panics, leaving dangling pointers a
    # later eviction can dereference. Triggering it needs BOTH a key type whose
    # `Drop` can panic AND `catch_unwind` around the cache operation.
    # Provable non-applicability: (1) `lru` has exactly one path into the tree —
    # paksmith-gui → iced 0.14 → iced_renderer → iced_wgpu → cryoglyph — and
    # cryoglyph's only use is `glyph_cache: LruCache<CacheKey, GlyphDetails,
    # Hasher>` (text_atlas.rs), evicting via `pop_lru()`. (2) That key type is
    # `cosmic_text::CacheKey`, declared `#[derive(Clone, Copy, ...)]`. Rust
    # FORBIDS `Drop` on a `Copy` type, so the key's drop glue is trivial by
    # construction — the advisory's precondition is not merely unlikely here, it
    # is unsatisfiable. (3) paksmith wraps no cache operation in `catch_unwind`.
    # Fix is upstream-BLOCKED: cryoglyph requires `lru = "^0.16"`, so
    # `cargo update -p lru --precise 0.18.2` fails outright ("candidate versions
    # found which didn't match"). Remove this ignore when an iced release ships a
    # cryoglyph allowing lru >= 0.18.2 — and re-check if cryoglyph ever adds a
    # second LruCache with a non-`Copy` key.
    { id = "RUSTSEC-2026-0253", reason = "lru reaches the tree only via cryoglyph's glyph cache, whose key type cosmic_text::CacheKey is `Copy` — Rust forbids Drop on a Copy type, so the advisory's panicking-key-Drop precondition is unsatisfiable, which alone is dispositive; paksmith itself wraps no cache operation in catch_unwind (winit's event loops do use it, so that half is NOT a standing guarantee); fix blocked because cryoglyph pins lru ^0.16" },

    # RUSTSEC-2026-0391 and RUSTSEC-2026-0395..0406: the zstd / zstd-safe
    # advisory wave. paksmith-core is on the fixed zstd 0.14.3 / zstd-safe
    # 8.2.0. The affected copies come only from the git-pinned parser oracles in
    # paksmith-fixture-gen and, as dev-dependencies, in paksmith-bench: repak at
    # e215472c pulls zstd 0.13.3 and zstd-safe 7.2.4, and unreal_asset at
    # f4df5d8e pulls zstd 0.12.4 and zstd-safe 6.0.6, which only the second
    # group below reaches. The oracles call only `zstd::stream::encode_all`,
    # `stream::read::Decoder::new` and `stream::copy_decode`, on paksmith's own
    # generated fixtures, and never ship in a paksmith binary. No fix exists on
    # their zstd lines (repak master still pins zstd 0.13). Remove the first
    # group when repak moves to zstd 0.14.3+, and the second when both oracles
    # do.
    # First group: repak only.
    { id = "RUSTSEC-2026-0391", reason = "reached only by zstd 0.13.3 under the dev-only repak oracle, which paksmith-fixture-gen and paksmith-bench run on paksmith's own fixtures and no paksmith binary ships; unreal_asset's zstd 0.12.4 is below the affected range; paksmith-core uses the fixed zstd 0.14.3; repak master still pins zstd 0.13" },
    { id = "RUSTSEC-2026-0396", reason = "reached only by zstd-safe 7.2.4 under the dev-only repak oracle, which paksmith-fixture-gen and paksmith-bench run on paksmith's own fixtures and no paksmith binary ships; unreal_asset's zstd-safe 6.0.6 is below the affected range; paksmith-core uses the fixed zstd-safe 8.2.0; repak master still pins zstd 0.13" },
    { id = "RUSTSEC-2026-0398", reason = "reached only by zstd-safe 7.2.4 under the dev-only repak oracle, which paksmith-fixture-gen and paksmith-bench run on paksmith's own fixtures and no paksmith binary ships; unreal_asset's zstd-safe 6.0.6 is below the affected range; paksmith-core uses the fixed zstd-safe 8.2.0; repak master still pins zstd 0.13" },
    { id = "RUSTSEC-2026-0405", reason = "reached only by zstd-safe 7.2.4 under the dev-only repak oracle, which paksmith-fixture-gen and paksmith-bench run on paksmith's own fixtures and no paksmith binary ships; unreal_asset's zstd-safe 6.0.6 is below the affected range; paksmith-core uses the fixed zstd-safe 8.2.0; repak master still pins zstd 0.13" },
    # Second group: repak and unreal_asset.
    { id = "RUSTSEC-2026-0395", reason = "reached only by zstd-safe 7.2.4 (repak) and 6.0.6 (unreal_asset), the dev-only parser oracles that paksmith-fixture-gen and paksmith-bench run on paksmith's own fixtures and no paksmith binary ships; paksmith-core uses the fixed zstd-safe 8.2.0; no fix exists on the 6.x/7.x lines and neither oracle has moved to zstd 0.14" },
    { id = "RUSTSEC-2026-0397", reason = "reached only by zstd-safe 7.2.4 (repak) and 6.0.6 (unreal_asset), the dev-only parser oracles that paksmith-fixture-gen and paksmith-bench run on paksmith's own fixtures and no paksmith binary ships; paksmith-core uses the fixed zstd-safe 8.2.0; no fix exists on the 6.x/7.x lines and neither oracle has moved to zstd 0.14" },
    { id = "RUSTSEC-2026-0399", reason = "reached only by zstd-safe 7.2.4 (repak) and 6.0.6 (unreal_asset), the dev-only parser oracles that paksmith-fixture-gen and paksmith-bench run on paksmith's own fixtures and no paksmith binary ships; paksmith-core uses the fixed zstd-safe 8.2.0; no fix exists on the 6.x/7.x lines and neither oracle has moved to zstd 0.14" },
    { id = "RUSTSEC-2026-0400", reason = "reached only by zstd-safe 7.2.4 (repak) and 6.0.6 (unreal_asset), the dev-only parser oracles that paksmith-fixture-gen and paksmith-bench run on paksmith's own fixtures and no paksmith binary ships; paksmith-core uses the fixed zstd-safe 8.2.0; no fix exists on the 6.x/7.x lines and neither oracle has moved to zstd 0.14" },
    { id = "RUSTSEC-2026-0401", reason = "reached only by zstd-safe 7.2.4 (repak) and 6.0.6 (unreal_asset), the dev-only parser oracles that paksmith-fixture-gen and paksmith-bench run on paksmith's own fixtures and no paksmith binary ships; paksmith-core uses the fixed zstd-safe 8.2.0; no fix exists on the 6.x/7.x lines and neither oracle has moved to zstd 0.14" },
    { id = "RUSTSEC-2026-0402", reason = "reached only by zstd-safe 7.2.4 (repak) and 6.0.6 (unreal_asset), the dev-only parser oracles that paksmith-fixture-gen and paksmith-bench run on paksmith's own fixtures and no paksmith binary ships; paksmith-core uses the fixed zstd-safe 8.2.0; no fix exists on the 6.x/7.x lines and neither oracle has moved to zstd 0.14" },
    { id = "RUSTSEC-2026-0403", reason = "reached only by zstd-safe 7.2.4 (repak) and 6.0.6 (unreal_asset), the dev-only parser oracles that paksmith-fixture-gen and paksmith-bench run on paksmith's own fixtures and no paksmith binary ships; paksmith-core uses the fixed zstd-safe 8.2.0; no fix exists on the 6.x/7.x lines and neither oracle has moved to zstd 0.14" },
    { id = "RUSTSEC-2026-0404", reason = "reached only by zstd-safe 7.2.4 (repak) and 6.0.6 (unreal_asset), the dev-only parser oracles that paksmith-fixture-gen and paksmith-bench run on paksmith's own fixtures and no paksmith binary ships; paksmith-core uses the fixed zstd-safe 8.2.0; no fix exists on the 6.x/7.x lines and neither oracle has moved to zstd 0.14" },
    { id = "RUSTSEC-2026-0406", reason = "reached only by zstd-safe 7.2.4 (repak) and 6.0.6 (unreal_asset), the dev-only parser oracles that paksmith-fixture-gen and paksmith-bench run on paksmith's own fixtures and no paksmith binary ships; paksmith-core uses the fixed zstd-safe 8.2.0; no fix exists on the 6.x/7.x lines and neither oracle has moved to zstd 0.14" },
]

[licenses]
# In cargo-deny 0.16+ the `unlicensed` and `copyleft` keys were removed;
# anything outside the explicit allow-list is denied by default.
allow = [
    "MIT",
    "Apache-2.0",
    # Used by alloc-no-stdlib + alloc-stdlib (transitive via brotli via
    # unreal_asset in paksmith-fixture-gen).
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
]

# Scoped license exceptions: licenses allowed only for the specific
# crate listed, never globally. Keeps the workspace allow-list above
# narrow while permitting legitimate vendored upstreams.
[[licenses.exceptions]]
# libfuzzer-sys vendors LLVM's libFuzzer runtime, which carries the
# NCSA license (OSI-approved, FSF-libre). The crate itself is dual-
# licensed MIT OR Apache-2.0; the NCSA term applies only to the
# bundled runtime. Required to run cargo-deny against the `fuzz/`
# workspace, which is the only place this dep appears.
name = "libfuzzer-sys"
allow = ["NCSA"]

# Symphonia (Phase 3f Vorbis decode for `OggHandler`) and its sub-crates are
# MPL-2.0 — weak, file-level copyleft. paksmith only *links* the crates (no
# modifications to their source), so the MPL obligation is not triggered; the
# permissive workspace allow-list stays narrow by scoping the exception to the
# specific symphonia crates the Ogg+Vorbis feature set pulls in.
[[licenses.exceptions]]
name = "symphonia"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
name = "symphonia-core"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
name = "symphonia-codec-vorbis"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
name = "symphonia-format-ogg"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
name = "symphonia-metadata"
allow = ["MPL-2.0"]
# symphonia 0.6 split shared internals into `symphonia-common` (was
# `symphonia-utils-xiph` in 0.5); same MPL-2.0, same link-only obligation.
[[licenses.exceptions]]
name = "symphonia-common"
allow = ["MPL-2.0"]

# option-ext is a transitive dep of `dirs` (via dirs-sys). It carries
# MPL-2.0; paksmith only links it (no modification), same link-only
# obligation as the symphonia exceptions above.
[[licenses.exceptions]]
name = "option-ext"
allow = ["MPL-2.0"]

# The reqwest rustls-tls stack (Phase 5c) pulls in four crates with licenses
# outside the global allow-list. All are permissive — scoped here per the
# project convention to keep the global list narrow.
#
# ring: TLS crypto backend (via rustls). The package declares "Apache-2.0 AND
# ISC"; Apache-2.0 is already globally allowed; ISC is added here scoped to
# ring only. ISC is a 2-clause permissive license, functionally equivalent to
# MIT — no copyleft obligation.
[[licenses.exceptions]]
name = "ring"
allow = ["ISC"]

# rustls-webpki: certificate path validation (via rustls). ISC — same
# permissive terms as the ring exception above.
[[licenses.exceptions]]
name = "rustls-webpki"
allow = ["ISC"]

# untrusted: zero-copy byte-slice parser used internally by ring/rustls-webpki.
# ISC — same permissive terms as above.
[[licenses.exceptions]]
name = "untrusted"
allow = ["ISC"]

# webpki-roots: Mozilla CA root certificate bundle for rustls. CDLA-Permissive-2.0
# (Community Data License Agreement — Permissive). This is a permissive data
# license for the bundled CA root list, not a code license; it imposes no
# copyleft or source-disclosure obligation on paksmith.
[[licenses.exceptions]]
name = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

# Phase 6 (iced GUI): iced's transitive dependency tree pulls in five crates
# with licenses outside the global allow-list. All are permissive — scoped here
# per the project convention to keep the global list narrow.
#
# arrayref: byte-slice reference helpers (via tiny-skia → iced_tiny_skia).
# BSD-2-Clause ("Simplified") — 2-clause permissive, OSI/FSF free.
[[licenses.exceptions]]
name = "arrayref"
allow = ["BSD-2-Clause"]

# clipboard-win: Windows clipboard access (via window_clipboard → iced_winit).
# BSL-1.0 (Boost Software License) — permissive, OSI/FSF free. No copyleft.
[[licenses.exceptions]]
name = "clipboard-win"
allow = ["BSL-1.0"]

# error-code: Win32 error code helper (transitive via clipboard-win).
# BSL-1.0 — same terms as clipboard-win above.
[[licenses.exceptions]]
name = "error-code"
allow = ["BSL-1.0"]

# hexf-parse: hexadecimal float literal parsing (via wgpu-core → iced_wgpu).
# CC0-1.0 — public domain dedication. No restrictions whatsoever.
[[licenses.exceptions]]
name = "hexf-parse"
allow = ["CC0-1.0"]

# libloading: dynamic library loading (via wgpu-hal → iced_wgpu on non-Windows).
# ISC — 2-clause permissive, functionally equivalent to MIT. Same as the ring /
# rustls-webpki / untrusted exceptions above.
[[licenses.exceptions]]
name = "libloading"
allow = ["ISC"]

# Phase 6 Task 11 (muda native menu bar): muda's Linux GTK backend pulls in two
# crates with licenses or advisories outside the global allow-list.
#
# target-lexicon: target triple parsing (via muda → gtk → atk-sys → glib-sys →
# system-deps → cfg-expr → target-lexicon).  Licensed Apache-2.0 WITH
# LLVM-exception — the LLVM exception grants additional permissions beyond
# plain Apache-2.0 (removes the patent-retaliation clause concern for LLVM
# toolchain users). Permissive; no copyleft obligation.
[[licenses.exceptions]]
name = "target-lexicon"
allow = ["Apache-2.0 WITH LLVM-exception"]

# BSD-2-Clause — a standard permissive OSI license (BSD-3-Clause minus the
# non-endorsement clause; BSD-3-Clause is already in the global allow-list).
# Pulled transitively by the `image` crate's EXIF support, which arrives via
# iced's `image-without-codecs` feature (Phase 7b TextureViewer renders raw
# RGBA via `Handle::from_rgba`; the codec tree is disabled). Scoped per-crate
# per the narrow-allow-list convention.
[[licenses.exceptions]]
name = "kamadak-exif"
allow = ["BSD-2-Clause"]
[[licenses.exceptions]]
name = "mutate_once"
allow = ["BSD-2-Clause"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# trumank/repak is opt-in dev-only (cross-parser ground-truth fixture
# generator and the Layer 1+2 cross-validation tests). The `repak` name
# on crates.io is squatted by an unrelated abandoned crate, so the
# actual library only ships via GitHub. Pinned by SHA in
# crates/paksmith-fixture-gen/Cargo.toml — the standalone crate excluded
# from the workspace's default-members so routine local builds skip it.
#
# AstroTechies/unrealmodding hosts the `unreal_asset` crate used as the
# Phase-2a uasset cross-parser oracle (Task 12). It IS published to
# crates.io as 0.1.16, but the sister crates (unreal_asset_base /
# unreal_asset_exports / unreal_asset_properties) are part of the same
# workspace and must move in lockstep — pinning by git SHA avoids the
# version-skew window crates.io's per-crate publication allows.
allow-git = [
    "https://github.com/trumank/repak",
    "https://github.com/AstroTechies/unrealmodding",
]
