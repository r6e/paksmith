name: Release assets

# Builds the archives for a release tag, attaches them to that tag's
# draft GitHub Release, and publishes it. release.yml's release-please
# creates the tag and the draft; the tag push starts this workflow.
#
# The release is a draft until every asset is on it because the
# repository's releases are immutable: a published release accepts no
# more assets, and its tag can never be reused.
#
# If a run fails before publishing, the draft stays and "Re-run all
# jobs" finishes it. If no run started for a tag, dispatch this
# workflow from main with that tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose draft to build and publish, such as v0.2.0
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions: {}

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.target }})
    # A dispatch from another ref would run that ref's copy of this file.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 (glibc 2.35) for broader downstream compat —
          # ubuntu-latest is 24.04 with glibc 2.39 which breaks on
          # Debian stable / RHEL 8-9 / older Ubuntu LTS.
          #
          # Keep in step with nightly.yml's build matrix and with the
          # target list in the publish job below.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Check the tag
        shell: bash
        run: |
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::'${TAG}' is not a release tag"
            exit 1
          }
      # This job runs every dependency's build script, so it gets a
      # read-only token that is not persisted. No restored cache: the
      # binaries are handed to users, and the cache scope is shared
      # with every other job on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - name: Build and package
        id: package
        uses: ./.github/actions/package
        with:
          label: ${{ env.TAG }}
          target: ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksums }}
          if-no-files-found: error
          overwrite: true # a re-run replaces the earlier attempt's upload
          retention-days: 7

  # Runs no repository code: it only moves the built files onto the
  # release, so the write token never meets a build script.
  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload assets and publish the draft
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
      # Publishing cannot be undone, so it happens only for a draft and
      # only with exactly the expected files, each from its own
      # target's artifact.
      - name: Attach the assets and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "'${TAG}' is not a release tag"
          files=()
          for entry in \
            x86_64-unknown-linux-gnu:tar.gz \
            aarch64-apple-darwin:tar.gz \
            x86_64-pc-windows-msvc:zip; do
            target="${entry%%:*}"
            dir="assets/paksmith-${TAG}-${target}"
            files+=("${dir}/paksmith-${TAG}-${target}.${entry#*:}" "${dir}/SHA256SUMS-${target}.txt")
          done
          for file in "${files[@]}"; do
            [[ -f "${file}" && ! -L "${file}" ]] || fail "${file} is missing"
          done
          found="$(find assets -mindepth 1 ! -type d | wc -l)"
          [[ "${found}" -eq "${#files[@]}" ]] || fail "expected ${#files[@]} files under assets/, found ${found}"
          draft="$(gh release view "${TAG}" --json isDraft --jq .isDraft)"
          [[ "${draft}" == true ]] || fail "release ${TAG} is not a draft"
          # `--clobber` replaces assets an earlier attempt left on the draft.
          gh release upload "${TAG}" "${files[@]}" --clobber
          gh release edit "${TAG}" --draft=false
