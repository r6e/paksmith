name: Clippy SARIF

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  security-events: write

# An explicit `bash` runs with `-eo pipefail`, so a clippy failure in
# the SARIF pipe below reds the step instead of being masked by the pipe.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    name: Clippy Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          components: clippy

      - name: Install SARIF tools
        # Pin both crates to specific versions and pass `--locked` so
        # the Cargo.lock shipped with each crate is honored. Without
        # these flags, every CI run resolves to whatever crates.io
        # publishes that day — a silent supply-chain footgun if either
        # crate (or any transitive dep) is compromised. Bump the
        # versions deliberately when upgrading.
        run: cargo install --locked --version 0.8.0 clippy-sarif && cargo install --locked --version 0.8.0 sarif-fmt

      - name: Run Clippy with SARIF output
        # Same flags as the CI Lint job (rationale there).
        #
        # No command injection surface: the command line is fully
        # static (no `${{ github.event.* }}` interpolation), and
        # `cargo clippy` only reads source files from the checked-out
        # tree.
        run: >
          cargo clippy --workspace --all-targets --all-features --message-format=json
          | clippy-sarif
          | tee results.sarif
          | sarif-fmt

      - name: Upload SARIF to GitHub
        if: ${{ !cancelled() && hashFiles('results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
          wait-for-processing: true
