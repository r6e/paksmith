name: Release

# release-please opens release PRs from conventional commits on main.
# Merging the release PR re-triggers this workflow, and release-please
# creates the tag and a draft GitHub Release. The tag push starts
# release-assets.yml, which attaches the binaries and publishes.
#
# release-please-config.json sets `draft` because a published release
# accepts no more assets, and `force-tag-creation` because a draft
# alone has no tag. The workspace has one version, one tag and one
# changelog (`CHANGELOG.md`): the config's `extra-files` name every
# place the version is written, in `Cargo.toml` and both lockfiles.
# release-please only warns when one of them matches nothing. The
# `--locked` in deny.yml fails a release PR that left a `Cargo.lock`
# entry behind; a stale `fuzz/Cargo.lock` shows only in lockfiles.yml,
# after the merge. A commit that touches only `exclude-paths`
# directories starts no release and is in no changelog. Workflows are
# among them, so a fix to release-assets.yml waits for the next
# release; `.github/actions` builds the archives and stays counted.
# `commit-search-depth` must stay above the number of commits
# since `bootstrap-sha` until the first release, or the oldest drop
# out of its changelog unannounced; after that tag it can go.
#
# GitHub refuses a release body over 125,000 characters, and
# release-please creates the tag before the draft, so notes that long
# would leave a tag with no draft, and a re-run would fail the same
# way. actionlint.yml fails a release PR whose changelog section is
# too long (scripts/check-release-notes-size.sh); do not merge one
# that is red. Shorten the notes instead, in an ordinary pull request,
# and the next run here rebuilds the release PR:
# - before the first release, move `bootstrap-sha` forward. The
#   changelog then starts after that commit; it and the commits before
#   it are in no release's notes.
# - after it, set `last-release-sha` for one release and remove it
#   once that release is out (untested), or release more often.
# Editing `CHANGELOG.md` on the release PR's branch does not help:
# release-please sends the notes it keeps with the release PR.
#
# If a run fails for any other reason, re-run it: release-please picks
# up from the merged release PR.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a release-PR update mid-flight

# release-please works through the App token alone.
permissions: {}

jobs:
  release-please:
    name: release-please
    # A dispatch from another ref would run that ref's copy of this file.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The App's private key is a secret of this environment, whose
    # branch policy admits only `main`, so a workflow run on any other
    # ref cannot read it.
    environment:
      name: release
      deployment: false
    steps:
      # Mints a 1h installation token via the `r6e-release-please` App
      # (installed on this repo only). The App token unblocks PR
      # creation (which GITHUB_TOKEN can't do here) and lets the
      # release tag trigger downstream workflows.
      # Scope, environment settings, blast-radius, and rotation
      # procedure: SECURITY.md#r6e-release-please.
      - name: Mint installation token (r6e-release-please App)
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}
