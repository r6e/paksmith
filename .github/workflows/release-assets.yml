name: Release assets

# Builds the archives for a release tag, attests their provenance,
# attaches them to that tag's draft GitHub Release, writes its notes
# from the three crates' changelogs, and publishes it.
# release.yml describes how the tag and the draft come to exist.
#
# Recovery, while the release is still a draft:
# - A job failed: "Re-run failed jobs".
# - This file is wrong, the artifacts have expired, the tag was moved,
#   or no run started for the tag: fix main if needed, then dispatch
#   this workflow from main with the tag. A tag push runs the tagged
#   commit's copy of this file, re-runs included, and a dispatch runs
#   main's. The local actions come from the tagged commit either way,
#   so a fault in one of them needs a new tag. So does a missing
#   changelog, or a paksmith-cli changelog with no section for the
#   version, because the notes are read from the tagged commit. A
#   dispatched run's attestations name main and its head commit as
#   their source, not the tag and its commit.
# - The tag exists without a draft: re-run release.yml, which accepts
#   the existing tag and creates the draft, then dispatch this workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose draft to build and publish, such as v0.2.0
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions: {}

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Pins the commit once, so every build leg and the publish job agree
  # on it even if the tag moves or a job is re-run later.
  check:
    name: check
    # A dispatch from another ref would run that ref's copy of this file.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - name: Resolve the tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::'${TAG}' is not a release tag"
            exit 1
          }
          sha="$(gh api "repos/${GH_REPO}/commits/refs/tags/${TAG}" --jq .sha)"
          [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::${TAG} resolved to '${sha}', not a commit"
            exit 1
          }
          # A tag push's attestations name the pushed commit as their
          # source, so that must be the commit the build checks out.
          if [[ "${GITHUB_EVENT_NAME}" == push && "${sha}" != "${GITHUB_SHA}" ]]; then
            echo "::error::${TAG} now names ${sha}, but this run was started for ${GITHUB_SHA}; dispatch from main to build it"
            exit 1
          fi
          # A release is a commit of main, so a tag on anything else is
          # not built or attested.
          status="$(gh api "repos/${GH_REPO}/compare/${sha}...refs/heads/main" --jq .status)"
          [[ "${status}" == ahead || "${status}" == identical ]] || {
            echo "::error::${TAG} names ${sha}, which is not on main"
            exit 1
          }
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

  build:
    name: build (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 (glibc 2.35) for broader downstream compat —
          # ubuntu-latest is 24.04 with glibc 2.39 which breaks on
          # Debian stable / RHEL 8-9 / older Ubuntu LTS.
          #
          # Keep in step with nightly.yml's build matrix and with the
          # target list in the publish job below;
          # scripts/check-release-targets.sh fails CI when they differ.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      # This job runs every dependency's build script, so it gets a
      # read-only token that is not persisted.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - name: Build, package and upload
        uses: ./.github/actions/package
        with:
          label: ${{ env.TAG }}
          target: ${{ matrix.target }}
          retention-days: 7

  # Signs a statement that this run built each archive, for
  # `gh attestation verify` to check. It runs no repository code, so the
  # signing identity never meets a build script.
  attest:
    name: attest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # request the signing certificate
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: assets/*/paksmith-*

  # Runs no repository code: it moves the built files onto the release
  # and copies changelog text into its notes, so the write token never
  # meets a build script.
  publish:
    name: publish
    # Waits for `attest`, so a failed attestation blocks the release.
    needs: [check, build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload assets and publish the draft
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
      # Publishing cannot be undone, so it happens only for a draft
      # whose tag still names the built commit, and only when the draft
      # carries exactly the expected files, each from its own target's
      # artifact. The notes are built before anything is uploaded, and
      # applied by the edit that publishes.
      - name: Attach the assets and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILT_SHA: ${{ needs.check.outputs.sha }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }
          # .github/actions/package names the artifacts and their files.
          files=()
          for entry in \
            x86_64-unknown-linux-gnu:tar.gz \
            aarch64-apple-darwin:tar.gz \
            x86_64-pc-windows-msvc:zip; do
            target="${entry%%:*}"
            dir="assets/paksmith-${TAG}-${target}"
            files+=("${dir}/paksmith-${TAG}-${target}.${entry#*:}" "${dir}/SHA256SUMS-${target}.txt")
          done
          for file in "${files[@]}"; do
            [[ -f "${file}" && ! -L "${file}" ]] || fail "${file} is missing"
          done
          found="$(find assets -mindepth 1 ! -type d | wc -l)"
          [[ "${found}" -eq "${#files[@]}" ]] || fail "expected ${#files[@]} files under assets/, found ${found}"
          draft="$(gh release view "${TAG}" --json isDraft --jq .isDraft)"
          [[ "${draft}" == true ]] || fail "release ${TAG} is not a draft"
          tagged="$(gh api "repos/${GH_REPO}/commits/refs/tags/${TAG}" --jq .sha)"
          [[ "${tagged}" == "${BUILT_SHA}" ]] ||
            fail "${TAG} names ${tagged}, but the assets were built from ${BUILT_SHA}"
          # release-please writes one changelog per crate and puts only
          # paksmith-cli's section on the draft, because the three crates
          # share the tag, whose version is paksmith-cli's. The notes below
          # carry all three sections.
          crates=(paksmith-cli paksmith-gui paksmith-core)
          changelog_url() {
            echo "https://github.com/${GH_REPO}/blob/${TAG}/crates/$1/CHANGELOG.md"
          }
          # Prints a crate's changelog at a ref.
          changelog_at() {
            gh api "repos/${GH_REPO}/contents/crates/$1/CHANGELOG.md?ref=$2" -H "Accept: application/vnd.github.raw"
          }
          # Prints the changelog section for this tag's version, and fails
          # when the changelog on stdin has no heading for it.
          section_of() {
            awk -v version="${TAG#v}" '
              /^## / {
                on = index($0, "## [" version "]") == 1 || index($0, "## " version " ") == 1
                found = found || on
                next
              }
              on
              END { exit !found }'
          }
          compare=""
          base=""
          # Used unquoted below, so that bash reads it as a pattern.
          version_tag='v[0-9]{1,9}\.[0-9]{1,9}\.[0-9]{1,9}'
          # What gh reported for a failed read, kept apart from what it
          # read. "(HTTP 404)" there means the tag or file does not exist.
          gh_error="$(mktemp)"
          not_found() {
            grep -q -F "(HTTP 404)" "${gh_error}"
          }
          # The prefix keeps gh's text from being read as a workflow command.
          gh_failed() {
            echo "gh reported: $(head -n 1 "${gh_error}")"
            fail "$1"
          }
          : > notes.md
          for crate in "${crates[@]}"; do
            changelog="$(changelog_at "${crate}" "${BUILT_SHA}")" || fail "could not read ${crate}'s changelog at ${BUILT_SHA}"
            # The tag is paksmith-cli's release, so a missing heading there
            # means the changelog is not this release's. Another crate may
            # have none: it did not change, or its own version differs, so
            # the notes link to its changelog and claim nothing. A heading
            # with nothing under it is a crate that did not change.
            if section="$(section_of <<< "${changelog}")"; then
              [[ "${section}" =~ [^[:space:]] ]] || section="No changes in this crate."
              # A crate whose version ran ahead of paksmith-cli's had this
              # section in an earlier release. paksmith-cli comes first, so
              # the previous tag is known by the time another crate is read.
              # A crate that had no changelog at that tag is new since then.
              # Any other failed read stops the publish: guessing would print
              # an earlier release's changes as this one's.
              if [[ -n "${compare}" ]]; then
                if earlier="$(changelog_at "${crate}" "${base}" 2> "${gh_error}")"; then
                  if section_of <<< "${earlier}" > /dev/null; then
                    echo "::warning::${crate}'s section for ${TAG#v} was already in its changelog at ${base}, so the notes link to it instead"
                    section="This crate's ${TAG#v} was part of an earlier release: see [this crate's changelog]($(changelog_url "${crate}"))."
                  fi
                elif ! not_found; then
                  gh_failed "could not read ${crate}'s changelog at ${base}"
                fi
              fi
            else
              [[ "${crate}" != paksmith-cli ]] || fail "${crate}'s changelog has no section for ${TAG#v}"
              echo "::warning::${crate}'s changelog has no section for ${TAG#v}, so the notes link to it instead"
              section="No section for ${TAG#v}: see [this crate's changelog]($(changelog_url "${crate}"))."
            fi
            # The version heading, which the notes drop, links this tag's
            # comparison with the previous one, when there is one.
            link="$(awk -v start="## [${TAG#v}](" '
              index($0, start) == 1 { print substr($0, length(start) + 1); exit }' <<< "${changelog}")"
            link="${link%%)*}"
            # Only paksmith-cli's link is read, since the tag is its release,
            # and it is kept only if it is this repository's comparison of
            # another version tag with this one. release-please writes
            # the link whether or not its earlier tag exists, and for the
            # first release that tag was never made. Any other failed
            # lookup stops the publish, because without the earlier tag the
            # other crates' sections are not checked against it.
            if [[ "${crate}" == paksmith-cli && "${link}" =~ ^"https://github.com/${GH_REPO}/compare/"(${version_tag})\.\.\.(${version_tag})$ &&
              "${BASH_REMATCH[1]}" != "${TAG}" && "${BASH_REMATCH[2]}" == "${TAG}" ]]; then
              base="${BASH_REMATCH[1]}"
              if gh api "repos/${GH_REPO}/git/ref/tags/${base}" > /dev/null 2> "${gh_error}"; then
                compare="${link}"
              elif not_found; then
                echo "::notice::tag ${base} does not exist, so the notes carry no comparison link"
              else
                gh_failed "could not look up tag ${base}"
              fi
            fi
            printf '## %s\n%s\n\n' "${crate}" "${section}" >> notes.md
          done
          # GitHub refuses a release body over 125,000 characters. Counting
          # bytes instead can only overcount them.
          if (($(wc -c < notes.md) > 120000)); then
            echo "::warning::the notes are too long for a release body, so the release links to the changelogs instead"
            printf "The changes in this release are listed in each crate's changelog:\n\n" > notes.md
            for crate in "${crates[@]}"; do
              printf -- '- [%s](%s)\n' "${crate}" "$(changelog_url "${crate}")" >> notes.md
            done
          fi
          [[ -z "${compare}" ]] || printf '\n**Full changelog**: %s\n' "${compare}" >> notes.md
          # `--clobber` replaces assets an earlier attempt left on the draft.
          gh release upload "${TAG}" "${files[@]}" --clobber
          expected="$(printf '%s\n' "${files[@]##*/}" | sort)"
          attached="$(gh release view "${TAG}" --json assets --jq '.assets[].name' | sort)"
          [[ "${attached}" == "${expected}" ]] ||
            fail "release ${TAG} must carry only the built assets, but carries: ${attached//$'\n'/ }"
          gh release edit "${TAG}" --notes-file notes.md --draft=false
