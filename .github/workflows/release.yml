name: Release

# release-please opens release PRs from conventional commits on main.
# Merging the release PR re-triggers this workflow, and release-please
# creates the tag and a draft GitHub Release. The tag push starts
# release-assets.yml, which attaches the binaries and publishes.
#
# release-please-config.json sets `draft` because a published release
# accepts no more assets, and `force-tag-creation` because a draft
# alone has no tag. All three crates share one tag, so only the
# paksmith-cli entry creates a release.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a release-PR update mid-flight

# release-please works through the App token alone.
permissions: {}

jobs:
  release-please:
    name: release-please
    # A dispatch from another ref would run that ref's copy of this file.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Mints a 1h installation token via the `paksmith-release-please`
      # App (installed on this repo only). The App token unblocks PR
      # creation (which GITHUB_TOKEN can't do here) and lets the
      # release tag trigger release-assets.yml.
      # Scope, blast-radius, and rotation procedure:
      # SECURITY.md#paksmith-release-please.
      - name: Mint installation token (paksmith-release-please App)
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}
